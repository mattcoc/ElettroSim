[package]
name = "elettrosim"
version = "2.0.0"
description = "ElettroSim: editor e simulatore di schemi elettrici"
authors = ["mattcoc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "elettrosim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
getrandom = "0.2"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
